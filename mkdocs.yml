site_name: whatchanged
site_description: Which segment explains a change in a metric.
repo_url: https://github.com/dbechrakis/whatchanged
theme:
  name: material
nav:
  - Start: index.md
  - The three kinds of answer: answers.md
  - Reference: api.md
  - Benchmark: benchmark.md
  - A worked case: case-study.md
  - A second case, flights: flights.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
exclude_docs: |
  plan.md
  benchmark-plan.md
  adtributor-notes.md
